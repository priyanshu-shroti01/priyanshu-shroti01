name: Generate Activity Graph

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate activity graph
        run: node .github/scripts/activity-graph.mjs dist/activity-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Push graph to output-activity branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-activity
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
